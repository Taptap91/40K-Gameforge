<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RulesForge</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a5fd8">
<meta name="rf-version" content="8.49">
<!-- Lets "Add to Home Screen" on iOS launch full-screen with no Safari chrome, like a real app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RulesForge">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=8.49">
<link rel="stylesheet" href="battle/battle.css?v=8.49">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z"/></svg></div>
      RulesForge
    </div>
    <nav>
      <div class="nav-label">Play</div>
      <button class="nav-item" data-view="rules" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Ask Rules
      </button>
      <button class="nav-item" data-view="lists">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
        Army Lists
      </button>
      <button class="nav-item" data-view="battle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z"/></svg>
        Battle
      </button>
      <button class="nav-item" data-view="factions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/><path d="m11 19-6-6M8 16l-4 4M5 21l-2-2"/></svg>
        Game Packs
      </button>
      <button class="nav-item nav-settings" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="app-version" title="App version">Version 8.49 · List builder</div>
    <button class="ai-status" id="aiStatusBtn" type="button">
      <span class="dot" id="aiDot"></span>
      <span><span class="label">AI model</span><small id="aiStatusText">Not set up</small></span>
    </button>
  </aside>

  <main>
    <!-- ================= RULES ================= -->
    <section class="view" id="view-rules">
      <header class="toolbar">
        <h1>Ask Rules</h1>
        <div class="spacer"></div>
        <select class="select" id="scopeSelect" title="Which documents to search"></select>
        <button class="btn" id="clearChat" type="button">Clear</button>
      </header>
      <div class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></div>
      <form class="composer" id="composer">
        <div class="composer-inner">
          <textarea id="question" rows="1" placeholder="Ask how a rule works…"></textarea>
          <button class="send" id="sendBtn" type="submit" aria-label="Send" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
    </section>

    <!-- ================= LISTS ================= -->
    <section class="view hidden" id="view-lists">
      <header class="toolbar"><h1 id="listsTitle">Army Lists</h1><div class="spacer"></div><div id="listsToolbar" class="lb-toolbar"></div></header>
      <div class="scroll">
        <div class="content" id="listsHost"></div>
      </div>
    </section>

    <!-- ================= FACTIONS ================= -->
    <section class="view hidden" id="view-factions">
      <header class="toolbar fp-toolbar"><h1>Factions</h1><div id="factionsToolbar" class="fp-bar"></div></header>
      <div class="fp-host" id="factionsHost"></div>
      <!-- Library: the Factions home on phones and tablets; a panel that slides in from the right on desktop. -->
      <div class="lib-scrim" data-lib-close></div>
      <aside class="lib-panel" id="libPanel" aria-label="Library">
        <div class="lib-head"><h2>Library</h2><button class="lib-x" type="button" data-lib-close aria-label="Close library"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div class="lib-body">
          <div id="docList" class="stack"></div>
          <button class="lib-addtile" type="button" data-lib-packs><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Click to add Game Pack</button>
          <p class="hint">Everything in your Library comes from a Game Pack you've downloaded.</p>
        </div>
      </aside>
    </section>


    <!-- ================= BATTLE ================= -->
    <section class="view hidden" id="view-battle">
      <header class="toolbar"><h1>Battle</h1><div class="spacer"></div><div id="battleTools"></div></header>
      <div class="scroll"><div class="content bt-content" id="battleHost"></div></div>
    </section>
  </main>
</div>

<datalist id="factionList"></datalist>
<dialog id="sheet"></dialog>
<div class="toast" id="toast"></div>

<script>
/* If the app's scripts fail to start (usually because some files on the site are from an older version), say so. */
setTimeout(function () {
  if (window.rfStarted) return;
  var bar = document.createElement("div");
  bar.className = "version-warn";
  bar.textContent = "RulesForge couldn't start: some files on the site are missing or from an older version. Upload every file from the latest version to GitHub, wait a minute, then reload.";
  document.body.prepend(bar);
}, 5000);
</script>
<script type="module" src="js/main.js?v=8.49"></script>
</body>
</html>
