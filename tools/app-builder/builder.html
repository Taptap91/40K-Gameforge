<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RulesForge App Builder</title>
<style>
:root{color-scheme:dark;--bg:#161618;--c:#232326;--b:#38383d;--t:#f2f2f4;--m:#9a9aa2;--a:#0a84ff;--o:#ff9f0a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:13px/1.35 system-ui,sans-serif;display:grid;grid-template-columns:330px 1fr;grid-template-rows:48px 1fr}

header b{font-size:15px}.seg{display:flex;border:1px solid var(--b);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;background:transparent;padding:6px 12px}.seg button.on{background:var(--a);color:#fff}
button,input,select{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:7px;padding:6px 8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.p{background:var(--a);border-color:var(--a);font-weight:600}
.sp{flex:1}#status{color:var(--m)}#status.dirty{color:var(--o)}#status.ok{color:#5ddc8b}#status.err{color:#ff6b6b}
aside{overflow:auto;padding:12px;border-right:1px solid var(--b);background:var(--c)}
h3{margin:16px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--m)}h3:first-child{margin-top:0}
.f{display:grid;grid-template-columns:112px 1fr;gap:6px;align-items:center;margin:5px 0}.f label{color:var(--m)}.f input,.f select{width:100%;min-width:0}
.c{display:flex;gap:4px}.c input[type=color]{width:34px;padding:1px;flex:none}.c input[type=text]{flex:1}.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sel{background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:8px;font:12px ui-monospace,monospace;word-break:break-all;color:#9fd0ff}
.hint{color:var(--m);font-size:12px;margin:4px 0}label.r{display:flex;gap:6px;align-items:flex-start;margin:4px 0;color:var(--t)}label.r input{width:auto;margin-top:2px}
main{display:flex;flex-direction:column;overflow:hidden;background:#0e0e10;min-height:0}#dbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--b);background:var(--c);flex-wrap:wrap}#dbar input[type=number]{width:70px}#dbar select{max-width:210px}#dbar span{color:var(--m)}#wsl{width:150px;padding:0}#cv{flex:1;overflow:auto;padding:14px;min-height:0}#sizer{margin:0 auto;position:relative}
#wrap{transform-origin:top left;background:#000;box-shadow:0 0 0 1px var(--b);position:absolute;left:0;top:0}iframe{border:0;display:block;width:100%;height:100%;background:#1c1c1e}
.ch{display:flex;gap:6px;align-items:center;font:11px ui-monospace,monospace;margin:3px 0}.ch span{flex:1;word-break:break-all}.ch button{padding:1px 6px}
.bx{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.bx label{display:flex;gap:2px;align-items:center;color:var(--m);font-size:11px}.bx input{padding:4px;width:100%;min-width:0}.pg{display:grid;grid-template-columns:1fr auto auto;gap:4px;margin:6px 0;padding:6px;border:1px solid var(--b);border-radius:8px}.pg label.r{margin:0}textarea{width:100%;font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:7px;padding:6px}.lr{display:flex;align-items:center;gap:2px;padding:2px 4px;border-radius:6px;cursor:pointer;white-space:nowrap}.lr:hover{background:rgba(255,255,255,.06)}.lr.on{background:rgba(10,132,255,.28)}.lr.many{background:rgba(10,132,255,.16)}.lr .tg{width:14px;text-align:center;color:var(--m);flex:none}.lr .nm{flex:1;overflow:hidden;text-overflow:ellipsis}.lr button{border:0;background:transparent;padding:0 3px;font-size:12px;opacity:.8}.lr.off .nm{opacity:.4}.lr.dt-before{box-shadow:0 -2px 0 #ff9f0a}.lr.dt-after{box-shadow:0 2px 0 #ff9f0a}.lr.dt-in{outline:2px solid #ff9f0a}.lr.gp{font-weight:600}details{margin:8px 0}details.grp{border-top:1px solid var(--b);margin:0;padding:6px 0}details.grp>summary{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--m);padding:4px 0}.cm{border:1px solid var(--b);border-radius:8px;padding:6px;margin:6px 0}.cm .f{grid-template-columns:70px 1fr;margin:3px 0}.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.mini label{display:flex;gap:4px;align-items:center;color:var(--m);font-size:11px}.mini input,.mini select{width:100%;min-width:0;padding:4px}.st{margin:8px 0;padding:6px;border:1px solid var(--b);border-radius:8px}summary{cursor:pointer;color:var(--m)}
</style>
<header><b>App Builder</b>
<div class="seg" id="modes"><button data-m="interact" class="on" title="Use the app normally to get to the screen you want to edit">Use the app</button><button data-m="edit" title="Click any part of the app to change it">Edit</button></div>
<span class="sp"></span><span id="status">Loading…</span>
<button id="undo" disabled>Undo</button><button id="save" class="p">Save</button></header>

<aside id="side"></aside>
<main id="stage"><div id="dbar"><div class="seg" id="devs"><button data-d="desktop" class="on">Desktop</button><button data-d="tablet">Tablet</button><button data-d="phone">Phone</button></div><select id="dsel" title="Test on a particular device"></select><input id="dw" type="number" min="280" max="3840" title="Width"><span>×</span><input id="dh" type="number" min="280" max="3840" title="Height"><button id="drot" title="Rotate (swap width and height)">⟳</button><input id="wsl" type="range" min="280" max="2000" title="Drag to test every width"><select id="dz" title="Zoom"><option value="fit">Fit</option><option value="100">100%</option><option value="75">75%</option><option value="50">50%</option></select><span id="dlab"></span></div><div id="cv"><div id="sizer"><div id="wrap"><iframe id="frame"></iframe></div></div></div></main>

<script>
const $=id=>document.getElementById(id);
const DEV={desktop:{w:1400,bp:"@media (min-width:1280px)"},tablet:{w:820,bp:"@media (min-width:761px) and (max-width:1279px)"},phone:{w:402,bp:"@media (max-width:760px)"}};
const STATE=/^(active|open|on|sel|selected|hidden|disabled|focus|hover|current|is-|has-|dragging|show|visible|loading|collapsed|compact)/;
const EMPTY=()=>({css:"",labels:[],pages:[],elements:[],actions:[],styles:[],applied:[],locks:[],names:[],groups:[],rules:{all:{},desktop:{},tablet:{},phone:{}}});
let selUid=null,fw=1440,fh=900,zoom="fit",tab="design",multi=[],layerEls=[],openEls=new WeakSet(),dragFrom=-1;
let data=EMPTY(),dev="desktop",mode="interact",scope="device",selMode="like",sel=null,doc=null,win=null,pstate="",editStyle=null,freeMove=false;
let committed="",undoStack=[],dirty=false,placeWhere="";const openG=new Set(["add","act","Fill and border","Size and space"]);
const SUF={"":"",hover:":hover",active:":active",focus:":focus-visible"};
const camel=k=>k.replace(/-(\w)/g,(_,c)=>c.toUpperCase());
const O=(...a)=>[["","—"],...a.map(x=>Array.isArray(x)?x:[x,x])];
const ANIMS=[["","None"],["rf-fade-in","Fade in"],["rf-slide-up","Slide up"],["rf-slide-down","Slide down"],["rf-slide-left","Slide in from the right"],["rf-slide-right","Slide in from the left"],["rf-zoom-in","Zoom in"],["rf-pop","Pop"],["rf-flip-in","Flip in"],["rf-shake","Shake"],["rf-pulse","Pulse (loops)"],["rf-float","Float (loops)"],["rf-spin","Spin (loops)"],["rf-glow","Glow (loops)"],["rf-blink","Blink (loops)"]];
const LOOPS=["rf-pulse","rf-float","rf-spin","rf-glow","rf-blink"];
const EASE=O(["ease","Smooth"],["ease-in","Ease in"],["ease-out","Ease out"],["ease-in-out","Ease in and out"],["linear","Even"],["cubic-bezier(.34,1.56,.64,1)","Bounce"]);
const flexy=cs=>/flex/.test(cs.display),gridy=cs=>/grid/.test(cs.display);
const SECTIONS=[
 {n:"Text style",r:[{k:"color",l:"Text colour",t:"color"},{k:"font-size",l:"Size",t:"text",u:"px"},{k:"font-weight",l:"Weight",t:"sel",o:O(["300","Light"],["400","Regular"],["500","Medium"],["600","Semi-bold"],["700","Bold"],["800","Extra bold"])},{k:"font-family",l:"Font",t:"sel",o:O(["system-ui,sans-serif","Sans"],["Georgia,serif","Serif"],["ui-monospace,monospace","Mono"],["'Trebuchet MS',sans-serif","Rounded"],["Impact,sans-serif","Poster"])},{k:"font-style",l:"Italic",t:"sel",o:O("normal","italic")},{k:"text-align",l:"Align",t:"sel",o:O("left","center","right")},{k:"line-height",l:"Line height",t:"text",ph:"1.4"},{k:"letter-spacing",l:"Letter spacing",t:"text",u:"px"},{k:"text-transform",l:"Capitals",t:"sel",o:O(["none","As typed"],["uppercase","ALL CAPS"],["lowercase","lowercase"],["capitalize","Capitalise Words"])},{k:"text-decoration",l:"Underline",t:"sel",o:O(["none","None"],["underline","Underline"],["line-through","Strike"])},{t:"shadow",k:"text-shadow",l:"Text shadow",spread:false}]},
 {n:"Fill and border",r:[{t:"fill",l:"Fill"},{k:"border-width",l:"Border width",t:"text",u:"px"},{k:"border-style",l:"Border style",t:"sel",o:O("none","solid","dashed","dotted","double")},{k:"border-color",l:"Border colour",t:"color"},{t:"box",l:"Corner rounding",keys:["border-top-left-radius","border-top-right-radius","border-bottom-right-radius","border-bottom-left-radius"],lab:["TL","TR","BR","BL"],ph:"border-radius"}]},
 {n:"Effects",r:[{t:"shadow",k:"box-shadow",l:"Shadow",spread:true},{t:"fn",k:"filter",f:"blur",l:"Blur"},{t:"fn",k:"backdrop-filter",f:"blur",l:"Glass blur"},{k:"opacity",l:"Opacity",t:"text",ph:"1"},{k:"mix-blend-mode",l:"Blend",t:"sel",o:O("normal","multiply","screen","overlay","difference","soft-light")}]},
 {n:"Size and space",r:[{k:"width",l:"Width",t:"text",u:"px"},{k:"max-width",l:"Max width",t:"text",u:"px"},{k:"height",l:"Height",t:"text",u:"px"},{k:"min-height",l:"Min height",t:"text",u:"px"},{t:"box",l:"Space outside (margin)",keys:["margin-top","margin-right","margin-bottom","margin-left"],lab:["T","R","B","L"]},{t:"box",l:"Space inside (padding)",keys:["padding-top","padding-right","padding-bottom","padding-left"],lab:["T","R","B","L"]},{t:"align",l:"Position across"},{k:"overflow",l:"Overflow",t:"sel",o:O(["visible","Show"],["hidden","Clip"],["auto","Scroll"])}]},
 {n:"Position and layer",r:[{k:"position",l:"Positioning",t:"sel",o:O(["static","Normal flow"],["relative","Offset from its place"],["absolute","Free (in its box)"],["fixed","Stuck on screen"],["sticky","Sticky"])},{t:"box",l:"Offsets",keys:["top","right","bottom","left"],lab:["T","R","B","L"]},{k:"z-index",l:"Layer",t:"text",ph:"auto"},{t:"layer"},{t:"tform",l:"Move, rotate, scale"},{t:"free"}]},
 {n:"Arrange the contents",r:[{k:"flex-direction",l:"Direction",t:"sel",o:O(["row","Across"],["column","Down"]),show:flexy},{k:"flex-wrap",l:"Wrap",t:"sel",o:O(["nowrap","No"],["wrap","Yes"]),show:flexy},{k:"justify-content",l:"Spread",t:"sel",o:O(["flex-start","Start"],["center","Centre"],["flex-end","End"],["space-between","Space between"],["space-around","Space around"]),show:cs=>flexy(cs)||gridy(cs)},{k:"align-items",l:"Line up",t:"sel",o:O(["flex-start","Start"],["center","Centre"],["flex-end","End"],["stretch","Stretch"]),show:cs=>flexy(cs)||gridy(cs)},{k:"grid-template-columns",l:"Columns",t:"text",ph:"1fr 1fr 1fr",show:gridy},{k:"gap",l:"Gap",t:"text",u:"px",show:cs=>flexy(cs)||gridy(cs)}]},
 {n:"Animation",r:[{k:"animation-name",l:"Effect",t:"sel",o:ANIMS},{k:"animation-duration",l:"Length (ms)",t:"text",u:"ms",ph:"600"},{k:"animation-delay",l:"Delay (ms)",t:"text",u:"ms",ph:"0"},{k:"animation-timing-function",l:"Feel",t:"sel",o:EASE},{k:"animation-iteration-count",l:"Repeats",t:"sel",o:O(["1","Once"],["2","Twice"],["3","3 times"],["infinite","Forever"])},{t:"preview"},{k:"transition-duration",l:"Smooth changes (ms)",t:"text",u:"ms",ph:"0"},{k:"transition-timing-function",l:"Smooth feel",t:"sel",o:EASE}]}];
const OK=v=>!/[{};<>]|@import|expression/i.test(v)&&!/url\((?!\s*["']?(https?:|custom\/assets\/))/i.test(v);
const bucket=()=>scope==="all"?"all":dev;
const bucketOf=w=>w<=760?"phone":w<=1279?"tablet":"desktop";
const RANGE={desktop:"1280 px and wider",tablet:"761–1279 px",phone:"760 px and narrower"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- css + persistence ---------- */
const motionP=k=>/^(animation|transition)/.test(k);
function blk(r){const pl=[],mo=[];for(const[s,p]of Object.entries(r)){const a=[],b=[];for(const[k,v]of Object.entries(p)){if(v===""||v==null)continue;(motionP(k)?b:a).push(`${k}:${v} !important`)}if(a.length)pl.push(`${s}{${a.join(";")}}`);if(b.length)mo.push(`${s}{${b.join(";")}}`)}return pl.join("\n")+(mo.length?`\n@media (prefers-reduced-motion:no-preference){\n${mo.join("\n")}\n}`:"")}
function genCSS(){const out=[],sr={};for(const st of data.styles)for(const a of data.applied.filter(x=>x.style===st.id))sr[a.sel]={...(sr[a.sel]||{}),...st.props};out.push(blk(sr),blk(data.rules.all));
 for(const d of["desktop","tablet","phone"]){const b=blk(data.rules[d]);if(b.trim())out.push(`${DEV[d].bp}{\n${b}\n}`)}return out.filter(x=>x.trim()).join("\n")}
const payload=()=>({css:data.css,labels:data.labels,pages:data.pages,elements:data.elements,actions:data.actions});
function live(){data.css=genCSS();win?.__rfCustomApply?.(payload());reselect();mark(true)}
function reselect(){if(sel&&!sel.dataset?.rfEl&&!sel.isConnected&&selUid){const n=doc.querySelector(selUid);if(n){sel=n;n.setAttribute("data-rf-s","")}else sel=null}if(sel&&sel.dataset?.rfEl){const n=doc.querySelector(`[data-rf-el="${sel.dataset.rfEl}"]`);if(n){sel=n;n.setAttribute("data-rf-s","")}else sel=null}}
function mark(d,msg,cls){dirty=d;const s=$("status");s.textContent=msg||(d?"Unsaved changes":"Saved");s.className=cls||(d?"dirty":"ok")}
function commit(){const now=JSON.stringify(data);if(now!==committed){undoStack.push(committed);committed=now}$("undo").disabled=!undoStack.length}
$("undo").onclick=()=>{if(!undoStack.length)return;committed=undoStack.pop();data=Object.assign(EMPTY(),JSON.parse(committed));live();$("undo").disabled=!undoStack.length;render()};
const post=async(u,b)=>{const r=await fetch(u,{method:"POST",body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error);return j};
$("save").onclick=async()=>{try{data.css=genCSS();await post("/api/custom",data);mark(false,"Saved to custom/custom.json","ok")}catch(e){mark(true,e.message,"err")}};
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

/* ---------- selectors and the rule being edited ---------- */
function pathSel(el){const parts=[];let e=el;while(e&&e!==doc.body&&e.nodeType===1&&parts.length<16){if(e.id&&/^[A-Za-z][\w-]*$/.test(e.id)&&doc.querySelectorAll("#"+e.id).length===1){parts.unshift("#"+e.id);return parts.join(" > ")}
 parts.unshift(e.tagName.toLowerCase()+":nth-child("+([...e.parentNode.children].indexOf(e)+1)+")");e=e.parentElement}return"body > "+parts.join(" > ")}
function likeSel(el){const cl=[...el.classList].filter(c=>!STATE.test(c)&&/^[\w-]+$/.test(c));if(!cl.length)return null;const s=el.tagName.toLowerCase()+"."+cl.join(".");try{return doc.querySelectorAll(s).length?s:null}catch{return null}}
const curSel=()=>multi.length>1?multi.map(e=>uid(e)).join(", "):sel?(sel.dataset?.rfEl?`[data-rf-el="${sel.dataset.rfEl}"]`:selMode==="like"&&likeSel(sel)?likeSel(sel):pathSel(sel)):null;
const uid=el=>el.dataset?.rfEl?`[data-rf-el="${el.dataset.rfEl}"]`:pathSel(el);
const count=s=>{try{return doc.querySelectorAll(s).length}catch{return 0}};
const ruleSel=()=>curSel()+SUF[pstate];
const styleObj=()=>data.styles.find(x=>x.id===editStyle);
function bag(create){if(editStyle)return styleObj()?.props||{};const r=data.rules[bucket()],s=ruleSel();if(!r[s]&&create)r[s]={};return r[s]||{}}
function setRule(_s,k,v){v=(v==null?"":String(v)).trim();if(v&&!OK(v))return;const o=bag(true);if(!v){delete o[k];if(!editStyle){const r=data.rules[bucket()],s=ruleSel();if(r[s]&&!Object.keys(r[s]).length)delete r[s]}}else o[k]=v;live()}
const setMany=obj=>{for(const[k,v]of Object.entries(obj))setRule(null,k,v)};
function setTheme(n,v){const r=data.rules.all;v=(v||"").trim();if(v&&!OK(v))return;if(!v){if(r[":root"]){delete r[":root"][n];if(!Object.keys(r[":root"]).length)delete r[":root"]}}else(r[":root"]=r[":root"]||{})[n]=v;live()}

/* ---------- text, order ---------- */
function textNode(el){return[...el.childNodes].find(n=>n.nodeType===3&&n.nodeValue.trim())}
function labelFor(el){if(el.dataset?.rfEl)return null;const t=textNode(el);if(!t)return null;const now=t.nodeValue.trim();const l=data.labels.find(l=>l.to===now&&el.matches(l.sel));return{from:l?l.from:now,to:now,entry:l}}
function setLabel(v){const el=sel,info=labelFor(el);if(!info)return;data.labels=data.labels.filter(l=>!(l.sel===curSel()&&l.from===info.from)&&l!==info.entry);if(v.trim()&&v.trim()!==info.from)data.labels.push({sel:curSel(),from:info.from,to:v.trim()});live()}
function seqOf(parent){return[...parent.children].filter(c=>!/^(SCRIPT|STYLE)$/.test(c.tagName)&&c.id!=="rf-box"&&getComputedStyle(c).display!=="none").map((c,i)=>({c,i,o:+getComputedStyle(c).order||0})).sort((a,b)=>a.o-b.o||a.i-b.i).map(x=>x.c)}
const arrangeable=el=>el&&el.parentElement&&/flex|grid/.test(getComputedStyle(el.parentElement).display);
function moveTo(el,target,after){const p=el.parentElement,seq=seqOf(p).filter(c=>c!==el);let i=seq.indexOf(target);if(i<0)return;seq.splice(after?i+1:i,0,el);const b=bucket();
 seq.forEach((c,n)=>{const s=uid(c),o=(data.rules[b][s]=data.rules[b][s]||{});o.order=String((n+1)*10);if(getComputedStyle(c).position!=="static")o["z-index"]=String(n+1)});live();commit();render()}
function nudge(dir){const seq=seqOf(sel.parentElement),i=seq.indexOf(sel),j=i+dir;if(j<0||j>=seq.length)return;moveTo(sel,seq[j],dir>0)}

/* ---------- adding things, pages, actions, styles ---------- */
const rid=p=>p+Math.random().toString(36).slice(2,8);
const TYPES={heading:["Heading","New heading"],text:["Text","Some text"],button:["Button","Button"],image:["Image",""],rect:["Rectangle",""],ellipse:["Circle",""],line:["Line",""],divider:["Divider",""],space:["Space",""],row:["Row (items side by side)",""],column:["Column (items stacked)",""]};
const isBox=el=>el&&(el.classList.contains("rf-page-body")||/rf-el-(row|col)/.test(el.className));
const anchorOf=el=>el.dataset?.rfEl?`[data-rf-el="${el.dataset.rfEl}"]`:el.classList.contains("rf-page-body")?`#${el.parentElement.id} .rf-page-body`:pathSel(el);
function addEl(type){if(!sel)return;const d={id:rid("e"),type,text:TYPES[type][1],anchor:anchorOf(sel),where:placeWhere||(isBox(sel)?"end":"after"),action:{type:"default"}};if(type==="button")d.style="primary";data.elements.push(d);live();commit();const n=doc.querySelector(`[data-rf-el="${d.id}"]`);if(n)pick(n);else render()}
function descendants(a0){const out=[];const walk=a=>{for(const e of data.elements)if(e.anchor===a&&!out.includes(e)){out.push(e);walk(`[data-rf-el="${e.id}"]`)}};walk(a0);return out}
function delEl(id){const gone=new Set([id,...descendants(`[data-rf-el="${id}"]`).map(e=>e.id)]);data.elements=data.elements.filter(e=>!gone.has(e.id));for(const bk of Object.keys(data.rules))for(const k of Object.keys(data.rules[bk]))if([...gone].some(g=>k.includes(`[data-rf-el="${g}"]`)))delete data.rules[bk][k];data.applied=data.applied.filter(a=>![...gone].some(g=>a.sel.includes(`[data-rf-el="${g}"]`)));sel=null;live();commit();render()}
function newPage(){const p={id:rid("p"),title:"New page",menu:true,icon:"doc"};data.pages.push(p);live();commit();openPageEd(p.id)}
function openPageEd(id){win.__rfCustomOpenPage(id);if(mode==="edit"){const b=doc.querySelector(`#view-rf-${id} .rf-page-body`);if(b)return pick(b)}render()}
function delPage(id){if(!confirm("Delete this page and everything on it?"))return;const pa=data.pages.find(p=>p.id===id);if(!pa)return;descendants(`#view-rf-${id} .rf-page-body`).forEach(e=>delEl(e.id));data.pages=data.pages.filter(p=>p.id!==id);data.actions=data.actions.filter(a=>!(a.type==="page"&&a.target===id));win.__rfCustomHidePages?.();sel=null;live();commit();render()}
function getAct(){if(sel.dataset?.rfEl)return data.elements.find(e=>e.id===sel.dataset.rfEl)?.action||{type:"default"};return data.actions.find(a=>a.sel===uid(sel))||{type:"default"}}
function setAct(type,target){if(sel.dataset?.rfEl){data.elements.find(e=>e.id===sel.dataset.rfEl).action={type,target}}else{const s=uid(sel);data.actions=data.actions.filter(a=>a.sel!==s);if(type!=="default")data.actions.push({sel:s,type,target})}live();commit();render()}
async function upload(file){const r=await fetch("/api/asset?name="+encodeURIComponent(file.name),{method:"POST",body:file});const j=await r.json();if(!r.ok)throw Error(j.error);return j.src}

function layerDrop(el,tg,zone){if(!el||!tg||el===tg||el.contains(tg))return;

function setFrame(w,h,rerender=true){w=Math.max(280,Math.min(3840,Math.round(w)||fw));h=Math.max(280,Math.min(3840,Math.round(h)||fh));const old=dev;fw=w;fh=h;dev=bucketOf(w);

 [...$("devs").children].forEach(b=>b.classList.toggle("on",b.dataset.d===dev));$("dlab").textContent=`Editing the ${dev} range (${RANGE[dev]})`;fit();if(rerender&&(old!==dev||true))render()}
function fit(){const cv=$("cv"),k=zoom==="fit"?Math.min(1,(cv.clientWidth-28)/fw,(cv.clientHeight-28)/fh):+zoom/100,sz=$("sizer"),wr=$("wrap");sz.style.width=fw*k+"px";sz.style.height=fh*k+"px";wr.style.width=fw+"px";wr.style.height=fh+"px";wr.style.transform=`scale(${k})`}
