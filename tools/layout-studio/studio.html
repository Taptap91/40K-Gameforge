<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RulesForge Layout Studio</title>
<style>
:root{color-scheme:dark;--bg:#161618;--c:#232326;--b:#38383d;--t:#f2f2f4;--m:#9a9aa2;--a:#0a84ff;--o:#ff9f0a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:13px/1.35 system-ui,sans-serif;display:grid;grid-template-columns:330px 1fr;grid-template-rows:48px 1fr}
header{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:0 12px;border-bottom:1px solid var(--b);background:var(--c)}
header b{font-size:15px}.seg{display:flex;border:1px solid var(--b);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;background:transparent;padding:6px 12px}.seg button.on{background:var(--a);color:#fff}
button,input,select{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:7px;padding:6px 8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.p{background:var(--a);border-color:var(--a);font-weight:600}
.sp{flex:1}#status{color:var(--m)}#status.dirty{color:var(--o)}#status.ok{color:#5ddc8b}#status.err{color:#ff6b6b}
aside{overflow:auto;padding:12px;border-right:1px solid var(--b);background:var(--c)}
h3{margin:16px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--m)}h3:first-child{margin-top:0}
.f{display:grid;grid-template-columns:112px 1fr;gap:6px;align-items:center;margin:5px 0}.f label{color:var(--m)}.f input,.f select{width:100%;min-width:0}
.c{display:flex;gap:4px}.c input[type=color]{width:34px;padding:1px;flex:none}.c input[type=text]{flex:1}.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sel{background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:8px;font:12px ui-monospace,monospace;word-break:break-all;color:#9fd0ff}
.hint{color:var(--m);font-size:12px;margin:4px 0}label.r{display:flex;gap:6px;align-items:flex-start;margin:4px 0;color:var(--t)}label.r input{width:auto;margin-top:2px}
main{display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:14px;background:#0e0e10}
#wrap{transform-origin:top center;background:#000;box-shadow:0 0 0 1px var(--b);flex:none}iframe{border:0;display:block;width:100%;height:100%;background:#1c1c1e}
.ch{display:flex;gap:6px;align-items:center;font:11px ui-monospace,monospace;margin:3px 0}.ch span{flex:1;word-break:break-all}.ch button{padding:1px 6px}
details{margin:8px 0}summary{cursor:pointer;color:var(--m)}
</style>
<header><b>Layout Studio</b>
<div class="seg" id="devs"><button data-d="desktop" class="on">Desktop</button><button data-d="tablet">Tablet</button><button data-d="phone">Phone</button></div>
<div class="seg" id="modes"><button data-m="interact" class="on" title="Use the app normally to get to the screen you want to edit">Use the app</button><button data-m="edit" title="Click any part of the app to change it">Edit</button></div>
<span class="sp"></span><span id="status">Loading…</span>
<button id="undo" disabled>Undo</button><button id="save" class="p">Save</button></header>

<aside id="side"></aside>
<main id="stage"><div id="wrap"><iframe id="frame"></iframe></div></main>

<script>
const $=id=>document.getElementById(id);
const DEV={desktop:{w:1400,bp:"@media (min-width:1280px)"},tablet:{w:820,bp:"@media (min-width:761px) and (max-width:1279px)"},phone:{w:402,bp:"@media (max-width:760px)"}};
const STATE=/^(active|open|on|sel|selected|hidden|disabled|focus|hover|current|is-|has-|dragging|show|visible|loading|collapsed|compact)/;
let data={css:"",labels:[],rules:{all:{},desktop:{},tablet:{},phone:{}}},dev="desktop",mode="interact",scope="device",selMode="like",sel=null,doc=null,win=null;
let committed="",undoStack=[],dirty=false;
const PROPS=[
 {g:"Text",k:"color",l:"Text colour",t:"color"},{k:"font-size",l:"Size",t:"size"},
 {k:"font-weight",l:"Weight",t:"sel",o:[["","—"],["300","Light"],["400","Regular"],["500","Medium"],["600","Semi-bold"],["700","Bold"],["800","Extra bold"]]},
 {k:"text-align",l:"Align",t:"sel",o:[["","—"],["left","Left"],["center","Centre"],["right","Right"]]},
 {k:"font-family",l:"Font",t:"sel",o:[["","—"],["system-ui,sans-serif","Sans"],["Georgia,serif","Serif"],["ui-monospace,monospace","Mono"]]},
 {g:"Box",k:"background-color",l:"Background",t:"color"},{k:"border-radius",l:"Rounding",t:"text"},{k:"padding",l:"Padding",t:"text"},{k:"margin",l:"Margin",t:"text"},
 {k:"width",l:"Width",t:"text"},{k:"max-width",l:"Max width",t:"text"},{k:"opacity",l:"Opacity",t:"text"},
 {g:"Arrange the contents",k:"flex-direction",l:"Direction",t:"sel",o:[["","—"],["row","Across"],["column","Down"]],show:cs=>/flex/.test(cs.display)},
 {k:"flex-wrap",l:"Wrap",t:"sel",o:[["","—"],["nowrap","No"],["wrap","Yes"]],show:cs=>/flex/.test(cs.display)},
 {k:"justify-content",l:"Spread",t:"sel",o:[["","—"],["flex-start","Start"],["center","Centre"],["flex-end","End"],["space-between","Space between"],["space-around","Space around"]],show:cs=>/flex|grid/.test(cs.display)},
 {k:"align-items",l:"Line up",t:"sel",o:[["","—"],["flex-start","Start"],["center","Centre"],["flex-end","End"],["stretch","Stretch"]],show:cs=>/flex|grid/.test(cs.display)},
 {k:"grid-template-columns",l:"Columns",t:"text",ph:"e.g. 1fr 1fr 1fr",show:cs=>/grid/.test(cs.display)},
 {k:"gap",l:"Gap",t:"text",show:cs=>/flex|grid/.test(cs.display)}];
const OK=v=>!/[{};<>]|url\(|@import/i.test(v);
const bucket=()=>scope==="all"?"all":dev;

/* ---------- css + persistence ---------- */
function genCSS(){const blk=r=>Object.entries(r).map(([s,p])=>{const d=Object.entries(p).filter(([k,v])=>v!==""&&v!=null).map(([k,v])=>`${k}:${v} !important`).join(";");return d?`${s}{${d}}`:""}).filter(Boolean).join("\n");
 const out=[blk(data.rules.all)];for(const d of["desktop","tablet","phone"]){const b=blk(data.rules[d]);if(b)out.push(`${DEV[d].bp}{\n${b}\n}`)}return out.filter(Boolean).join("\n")}
function live(){data.css=genCSS();win?.__rfCustomApply?.({css:data.css,labels:data.labels});mark(true)}
function mark(d,msg,cls){dirty=d;const s=$("status");s.textContent=msg||(d?"Unsaved changes":"Saved");s.className=cls||(d?"dirty":"ok")}
function commit(){const now=JSON.stringify(data);if(now!==committed){undoStack.push(committed);committed=now}$("undo").disabled=!undoStack.length}
$("undo").onclick=()=>{if(!undoStack.length)return;committed=undoStack.pop();data=JSON.parse(committed);live();$("undo").disabled=!undoStack.length;render()};
const post=async(u,b)=>{const r=await fetch(u,{method:"POST",body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error);return j};
$("save").onclick=async()=>{try{data.css=genCSS();await post("/api/custom",data);mark(false,"Saved to custom/custom.json","ok")}catch(e){mark(true,e.message,"err")}};
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

/* ---------- selectors ---------- */
function pathSel(el){const parts=[];let e=el;while(e&&e!==doc.body&&e.nodeType===1&&parts.length<16){if(e.id&&/^[A-Za-z][\w-]*$/.test(e.id)&&doc.querySelectorAll("#"+e.id).length===1){parts.unshift("#"+e.id);return parts.join(" > ")}
 parts.unshift(e.tagName.toLowerCase()+":nth-child("+([...e.parentNode.children].indexOf(e)+1)+")");e=e.parentElement}return"body > "+parts.join(" > ")}
function likeSel(el){const cl=[...el.classList].filter(c=>!STATE.test(c)&&/^[\w-]+$/.test(c));if(!cl.length)return null;const s=el.tagName.toLowerCase()+"."+cl.join(".");try{return doc.querySelectorAll(s).length?s:null}catch{return null}}
const curSel=()=>sel?(selMode==="like"&&likeSel(sel)?likeSel(sel):pathSel(sel)):null;
const count=s=>{try{return doc.querySelectorAll(s).length}catch{return 0}};

/* ---------- editing ---------- */
function setRule(s,k,v){const r=data.rules[bucket()];v=(v||"").trim();if(v&&!OK(v))return;if(!v){if(r[s]){delete r[s][k];if(!Object.keys(r[s]).length)delete r[s]}}else{(r[s]=r[s]||{})[k]=v}live()}
function textNode(el){return[...el.childNodes].find(n=>n.nodeType===3&&n.nodeValue.trim())}
function labelFor(el){const t=textNode(el);if(!t)return null;const now=t.nodeValue.trim();const l=data.labels.find(l=>l.to===now&&el.matches(l.sel));return{from:l?l.from:now,to:now,entry:l}}
function setLabel(v){const el=sel,info=labelFor(el);if(!info)return;data.labels=data.labels.filter(l=>!(l.sel===curSel()&&l.from===info.from)&&l!==info.entry);if(v.trim()&&v.trim()!==info.from)data.labels.push({sel:curSel(),from:info.from,to:v.trim()});live()}
function seqOf(parent){return[...parent.children].filter(c=>!/^(SCRIPT|STYLE)$/.test(c.tagName)&&getComputedStyle(c).display!=="none").map((c,i)=>({c,i,o:+getComputedStyle(c).order||0})).sort((a,b)=>a.o-b.o||a.i-b.i).map(x=>x.c)}
const arrangeable=el=>el&&el.parentElement&&/flex|grid/.test(getComputedStyle(el.parentElement).display);
function moveTo(el,target,after){const p=el.parentElement,seq=seqOf(p).filter(c=>c!==el);let i=seq.indexOf(target);if(i<0)return;seq.splice(after?i+1:i,0,el);const b=bucket();
 seq.forEach((c,n)=>{const s=pathSel(c);(data.rules[b][s]=data.rules[b][s]||{}).order=String((n+1)*10)});live();commit();render()}
function nudge(dir){const seq=seqOf(sel.parentElement),i=seq.indexOf(sel),j=i+dir;if(j<0||j>=seq.length)return;moveTo(sel,seq[j],dir>0)}

/* ---------- the iframe ---------- */
let down=null,dragging=false,dropEl=null,dropAfter=false;
function install(){doc=$("frame").contentDocument;win=$("frame").contentWindow;
 const st=doc.createElement("style");st.id="rf-studio-ui";st.textContent="[data-rf-h]{outline:2px dashed #0a84ff!important;outline-offset:-2px}[data-rf-s]{outline:2px solid #ff9f0a!important;outline-offset:-2px}#rf-drop{position:fixed;z-index:99999;background:#ff9f0a;pointer-events:none;border-radius:2px}";doc.head.appendChild(st);
 const drop=doc.createElement("div");drop.id="rf-drop";drop.hidden=true;doc.body.appendChild(drop);
 const edit=()=>mode==="edit";
 const stop=e=>{if(edit()){e.stopPropagation();if(e.cancelable)e.preventDefault()}};
 for(const t of["mousedown","mouseup","touchstart","touchend","dblclick","contextmenu","submit","keydown"])doc.addEventListener(t,e=>{if(edit()&&!(t==="keydown"))stop(e)},true);
 doc.addEventListener("mouseover",e=>{if(!edit())return;doc.querySelectorAll("[data-rf-h]").forEach(x=>x.removeAttribute("data-rf-h"));if(e.target!==sel)e.target.setAttribute("data-rf-h","")},true);
 doc.addEventListener("pointerdown",e=>{if(!edit())return;stop(e);down={x:e.clientX,y:e.clientY,t:e.target};dragging=false},true);
 doc.addEventListener("pointermove",e=>{if(!edit()||!down||!sel)return;
  if(!dragging&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8&&(down.t===sel||sel.contains(down.t))&&arrangeable(sel))dragging=true;
  if(!dragging)return;const seq=seqOf(sel.parentElement).filter(c=>c!==sel);dropEl=null;
  for(const c of seq){const r=c.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){dropEl=c;const mine=sel.getBoundingClientRect();const sameRow=Math.abs(mine.top-r.top)<Math.min(mine.height,r.height)/2;dropAfter=sameRow?e.clientX>r.left+r.width/2:e.clientY>r.top+r.height/2;
   drop.hidden=false;Object.assign(drop.style,sameRow?{left:(dropAfter?r.right-2:r.left-1)+"px",top:r.top+"px",width:"3px",height:r.height+"px"}:{left:r.left+"px",top:(dropAfter?r.bottom-2:r.top-1)+"px",width:r.width+"px",height:"3px"});break}}
  if(!dropEl)drop.hidden=true},true);
 doc.addEventListener("pointerup",e=>{if(!edit())return;stop(e);drop.hidden=true;if(dragging&&dropEl)moveTo(sel,dropEl,dropAfter);down=null;setTimeout(()=>dragging=false,0)},true);
 doc.addEventListener("click",e=>{if(!edit())return;stop(e);if(dragging)return;pick(e.target)},true);
 doc.addEventListener("scroll",()=>{},true);live()}
function pick(el){if(!el||el===doc.documentElement||el===doc.body||el.id==="rf-drop")return;doc.querySelectorAll("[data-rf-s],[data-rf-h]").forEach(x=>{x.removeAttribute("data-rf-s");x.removeAttribute("data-rf-h")});sel=el;el.setAttribute("data-rf-s","");render()}
$("frame").onload=install;

/* ---------- side panel ---------- */
function hex(c){const m=/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/.exec(c||"");if(!m||m[4]==="0")return"#000000";return"#"+[1,2,3].map(i=>(+m[i]).toString(16).padStart(2,"0")).join("")}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){const a=$("side");let h="";
 h+=`<h3>Apply changes to</h3><label class="r"><input type="radio" name="sc" value="device" ${scope==="device"?"checked":""}><span>This screen size only (${dev})</span></label><label class="r"><input type="radio" name="sc" value="all" ${scope==="all"?"checked":""}><span>Every screen size</span></label>`;
 if(mode!=="edit"){h+=`<p class="hint">You're using the app normally. Go to the screen you want to change, then press <b>Edit</b> at the top and click anything.</p>`}
 else if(!sel||!sel.isConnected){sel=null;h+=`<p class="hint">Click any part of the app on the right. Dashed blue is what you're pointing at.</p>`}
 else{const like=likeSel(sel),cs=win.getComputedStyle(sel),s=curSel(),b=bucket(),cur=(data.rules[b][s]||{});
  h+=`<h3>Selected</h3><div class="sel">${esc(s)}</div><div class="row"><button id="up">↑ Select the block around it</button></div>`;
  h+=`<label class="r"><input type="radio" name="sm" value="like" ${selMode==="like"&&like?"checked":""} ${like?"":"disabled"}><span>All like this${like?` (${count(like)} on this screen)`:""}</span></label><label class="r"><input type="radio" name="sm" value="one" ${selMode==="one"||!like?"checked":""}><span>Only this one</span></label>`;
  const li=labelFor(sel);if(li)h+=`<h3>Text</h3><div class="f"><label>Wording</label><input id="txt" value="${esc(li.to)}"></div><div class="hint">Changes this wording everywhere it appears in the same spot.</div>`;
  h+=`<h3>Move</h3>`;if(arrangeable(sel))h+=`<div class="row"><button id="bk">◀ Earlier</button><button id="fw">Later ▶</button></div><div class="hint">Or drag the selected block onto another one in the app.</div>`;else h+=`<div class="hint">This block's container isn't a row, column or grid, so its order can't be changed. Select the block around it, or one of its siblings in a list.</div>`;
  let grp="";for(const p of PROPS){if(p.show&&!p.show(cs))continue;if(p.g&&p.g!==grp){h+=`<h3>${p.g}</h3>`;grp=p.g}const v=cur[p.k]||"";let inp;
   if(p.t==="color")inp=`<div class="c"><input type="color" data-k="${p.k}" value="${hex(v||cs[p.k.replace(/-(\w)/g,(_,c)=>c.toUpperCase())])}"><input type="text" data-k="${p.k}" value="${esc(v)}" placeholder="${esc(cs[p.k.replace(/-(\w)/g,(_,c)=>c.toUpperCase())])}"></div>`;
   else if(p.t==="sel")inp=`<select data-k="${p.k}">${p.o.map(([val,lab])=>`<option value="${val}" ${v===val?"selected":""}>${lab}</option>`).join("")}</select>`;
   else inp=`<input type="text" data-k="${p.k}" data-size="${p.t==="size"?1:0}" value="${esc(v)}" placeholder="${esc(p.ph||cs[p.k.replace(/-(\w)/g,(_,c)=>c.toUpperCase())])}">`;
   h+=`<div class="f"><label>${p.l}</label>${inp}</div>`}
  h+=`<div class="f"><label>Hide it</label><input type="checkbox" id="hide" ${cur.display==="none"?"checked":""} style="width:auto"></div><div class="row"><button id="clr">Clear my changes here</button></div>`}
 // all changes
 const rows=[];for(const bk of["all","desktop","tablet","phone"])for(const[s,p]of Object.entries(data.rules[bk]))rows.push(`<div class="ch"><span><b>${bk}</b> ${esc(s)}<br>${esc(Object.entries(p).map(([k,v])=>k+": "+v).join("; "))}</span><button data-rm="${bk}|${esc(s)}">✕</button></div>`);
 for(const[i,l]of data.labels.entries())rows.push(`<div class="ch"><span><b>text</b> “${esc(l.from)}” → “${esc(l.to)}”</span><button data-rl="${i}">✕</button></div>`);
 h+=`<details ${rows.length?"open":""}><summary>All my changes (${rows.length})</summary>${rows.join("")||'<div class="hint">None yet.</div>'}</details>`;
 h+=`<details><summary>Publish to GitHub</summary><div class="f"><label>Repository</label><input id="repo" value="Taptap91/40k-gameforge"></div><div class="f"><label>Branch</label><input id="br" value="game-packs"></div><div class="f"><label>Token</label><input id="tok" type="password" autocomplete="off"></div><label class="r"><input type="checkbox" id="rem"><span>Remember on this computer</span></label><div class="row"><button id="pub" class="p">Save and publish</button></div><div class="hint">Uploads only custom/custom.json. The live app picks it up on its next load. Token: fine-grained, one repository, Contents read/write.</div></details>`;
 h+=`<div class="row"><button id="rst">Reset everything to the original look</button></div>`;
 const keep=["repo","br","tok"].map(i=>$(i)?.value);a.innerHTML=h;["repo","br","tok"].forEach((i,n)=>{if(keep[n]!=null&&keep[n]!=="")$(i).value=keep[n]});wire()}
function wire(){const a=$("side");
 a.querySelectorAll('[name="sc"]').forEach(r=>r.onchange=()=>{scope=r.value;render()});a.querySelectorAll('[name="sm"]').forEach(r=>r.onchange=()=>{selMode=r.value;render()});
 if($("up"))$("up").onclick=()=>pick(sel.parentElement);
 a.querySelectorAll("[data-k]").forEach(i=>{const k=i.dataset.k,sync=()=>{let v=i.value;if(i.dataset.size==="1"&&/^\d+(\.\d+)?$/.test(v))v+="px";setRule(curSel(),k,v)};
  i.addEventListener("input",()=>{sync();if(i.type==="color"){const t=i.parentElement.querySelector('[type=text]');t.value=i.value}});i.addEventListener("change",()=>{sync();commit();render()})});
 if($("hide"))$("hide").onchange=e=>{setRule(curSel(),"display",e.target.checked?"none":"");commit();render()};
 if($("txt"))$("txt").oninput=e=>setLabel(e.target.value),$("txt")&&($("txt").onchange=()=>{commit();render()});
 if($("bk"))$("bk").onclick=()=>nudge(-1);if($("fw"))$("fw").onclick=()=>nudge(1);
 if($("clr"))$("clr").onclick=()=>{const s=curSel();for(const bk of Object.keys(data.rules))delete data.rules[bk][s];live();commit();render()};
 a.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const[bk,s]=b.dataset.rm.split("|");delete data.rules[bk][s];live();commit();render()});
 a.querySelectorAll("[data-rl]").forEach(b=>b.onclick=()=>{data.labels.splice(+b.dataset.rl,1);live();commit();render()});
 if($("rst"))$("rst").onclick=()=>{if(!confirm("Remove every change and go back to the original look?"))return;data.rules={all:{},desktop:{},tablet:{},phone:{}};data.labels=[];live();commit();render()};
 if($("pub"))$("pub").onclick=async()=>{try{data.css=genCSS();mark(true,"Publishing…");const r=await post("/api/publish",{repo:$("repo").value,branch:$("br").value,token:$("tok").value,remember:$("rem").checked,data});mark(false,"Published to "+r.published,"ok")}catch(e){mark(true,e.message,"err")}}}

/* ---------- chrome: devices, modes, fitting ---------- */
function fit(){const st=$("stage"),w=DEV[dev].w,k=Math.min(1,(st.clientWidth-28)/w),wrap=$("wrap");wrap.style.width=w+"px";wrap.style.height=Math.max(300,(st.clientHeight-28)/k)+"px";wrap.style.transform=`scale(${k})`;wrap.style.marginBottom=-(wrap.offsetHeight*(1-k))+"px"}
$("devs").onclick=e=>{const d=e.target.dataset.d;if(!d)return;dev=d;[...$("devs").children].forEach(b=>b.classList.toggle("on",b.dataset.d===d));fit();render()};
$("modes").onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;[...$("modes").children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));if(doc){doc.body.style.cursor=m==="edit"?"crosshair":"";if(m!=="edit")doc.querySelectorAll("[data-rf-s],[data-rf-h]").forEach(x=>{x.removeAttribute("data-rf-s");x.removeAttribute("data-rf-h")})}if(m!=="edit")sel=null;render()};
addEventListener("resize",fit);addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="z"){e.preventDefault();$("undo").click()}if(e.key==="Escape"&&sel){sel.removeAttribute("data-rf-s");sel=null;render()}});
fetch("/api/custom").then(r=>r.json()).then(d=>{data=d;committed=JSON.stringify(data);mark(false,"Ready","ok");fit();$("frame").src="/app/index.html?studio=1";render()});
</script></html>
